name: records

# Made by relay-kit init. Runs the records checks with relay-kit pinned to {{KIT_REF}}.
# Pinning to a commit SHA instead of a tag is stricter: a tag can be moved, a SHA can't.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write   # only to open and close the alert issue below

jobs:
  records:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install relay-kit {{KIT_REF}}
        run: python3 -m pip install --quiet "relay-kit @ git+https://github.com/{{KIT_REPO}}@{{KIT_REF}}"
      - name: Base revision for history checks
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="origin/${{ github.base_ref }}"; else BASE="${{ github.event.before }}"; fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD; fi
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"
      # Each check runs whatever the others did, so one failure can't hide another.
      - name: Handoffs are consistent, and no header or earlier log line was changed
        if: success() || failure()
        run: relay-kit handoff --dir handoffs check --base "${{ steps.base.outputs.ref }}"
      - name: Ledgers are valid and append-only
        if: success() || failure()
        run: relay-kit ledger check --dir governance --git --base "${{ steps.base.outputs.ref }}"
      # The alert goes to the repository owner (assigned, so GitHub notifies them). Whoever starts
      # fixing it acknowledges by commenting; `relay-kit status` shows red-and-unacknowledged at the
      # top for every session. The next green run on main closes it.
      - name: Open or update the alert issue when checks fail on main
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Records check failing on main"
          n=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          body="Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed at ${{ github.sha }}. To acknowledge, comment here with who is fixing it."
          if [ -n "$n" ]; then gh issue comment "$n" --repo "${{ github.repository }}" --body "$body"; else gh issue create --repo "${{ github.repository }}" --title "$title" --assignee "${{ github.repository_owner }}" --body "$body"; fi
      - name: Close the alert issue when main is green again
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Records check failing on main"
          for n in $(gh issue list --repo "${{ github.repository }}" --state open --search "in:title \"$title\"" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "${{ github.repository }}" --comment "Green again at ${{ github.sha }}."
          done
